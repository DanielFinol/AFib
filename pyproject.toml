[project]
name = "afib"
version = "0.1.0"
description = "Localise atrial fibrillation drivers from body-surface potentials with a small CNN (EDGAR Valencia rotor simulations)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "h5py>=3.10",          # MATLAB v7.3 .mat files
    "scikit-learn>=1.4",
    "torch>=2.2",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
afib-train = "afib.train:main"
afib-inspect = "afib.data.loaders:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/afib"]

# CPU-only PyTorch wheels (much smaller than the default CUDA build on Linux).
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
